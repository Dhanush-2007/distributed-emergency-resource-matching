[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ems-common"
version = "0.1.0"
description = "Shared library for the Distributed Emergency Resource Matching System"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["ems_common*"]
