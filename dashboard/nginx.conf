server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text assets
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Static assets
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Coordinator API proxy
    location /api/coord/ {
        proxy_pass http://coordinator:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_header Retry-After;
        proxy_pass_header X-Correlation-Id;

        proxy_connect_timeout 3s;
        proxy_read_timeout 6s;
        proxy_send_timeout 6s;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Request Service API proxy
    location /api/req/ {
        proxy_pass http://request-service:8001/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_header Retry-After;
        proxy_pass_header X-Correlation-Id;

        proxy_connect_timeout 3s;
        proxy_read_timeout 6s;
        proxy_send_timeout 6s;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # Resource Service API proxy
    location /api/res/ {
        proxy_pass http://resource-service:8002/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass_header Retry-After;
        proxy_pass_header X-Correlation-Id;

        proxy_connect_timeout 3s;
        proxy_read_timeout 6s;
        proxy_send_timeout 6s;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }
}
