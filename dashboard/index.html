<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMS Operations Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="ems-app">
  <div id="global-alert" class="global-banner" style="display: none;"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand-box">
        <div class="brand-title">EMS CONTROL</div>
        <div class="brand-sub">Emergency Dispatch Ops</div>
      </div>

      <nav class="nav-menu">
        <a href="#overview" id="nav-overview" class="nav-item active">Overview</a>
        <a href="#requests" id="nav-requests" class="nav-item">Requests</a>
        <a href="#resources" id="nav-resources" class="nav-item">Resources</a>
        <a href="#cluster" id="nav-cluster" class="nav-item">Cluster</a>
      </nav>

      <div class="sidebar-footer">
        <div class="kb-hint-title">SHORTCUTS</div>
        <div class="kb-hint"><kbd>g</kbd> <kbd>o</kbd> Overview</div>
        <div class="kb-hint"><kbd>g</kbd> <kbd>r</kbd> Requests</div>
        <div class="kb-hint"><kbd>g</kbd> <kbd>s</kbd> Resources</div>
        <div class="kb-hint"><kbd>g</kbd> <kbd>c</kbd> Cluster</div>
        <div class="kb-hint"><kbd>/</kbd> Focus Search</div>
      </div>
    </aside>

    <div class="workspace">
      <header class="status-strip">
        <div class="strip-left">
          <span id="strip-coord" class="status-badge status-healthy">COORDINATOR: OK</span>
          <span id="strip-shards" class="status-badge status-healthy">SHARDS: 3/3 HEALTHY</span>
        </div>
        <div class="strip-right">
          <span class="text-xs text-muted">POLL: 3s</span>
          <span id="strip-time" class="mono text-xs text-muted">--:--:--</span>
        </div>
      </header>

      <main id="main-content" class="main-content" role="main"></main>
    </div>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop" style="display: none;"></div>
  <aside id="side-drawer" class="drawer" aria-hidden="true"></aside>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
