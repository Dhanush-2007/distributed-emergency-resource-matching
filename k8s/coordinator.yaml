apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coordinator-state
  namespace: ems
  labels:
    app: coordinator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
  namespace: ems
  labels:
    app: coordinator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: coordinator
          image: ems/coordinator:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ems-config
          env:
            - name: STATE_DIR
              value: "/state"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: state-volume
              mountPath: /state
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/live
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: state-volume
          persistentVolumeClaim:
            claimName: coordinator-state
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator
  namespace: ems
  labels:
    app: coordinator
spec:
  selector:
    app: coordinator
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: coordinator-nodeport
  namespace: ems
  labels:
    app: coordinator
spec:
  type: NodePort
  selector:
    app: coordinator
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
