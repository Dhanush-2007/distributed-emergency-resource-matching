apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-service
  namespace: ems
  labels:
    app: request-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: request-service
  template:
    metadata:
      labels:
        app: request-service
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: request-service
          image: ems/request-service:1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ems-config
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: ems-secret
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: ems-secret
                  key: RABBITMQ_PASS
          ports:
            - containerPort: 8001
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/live
              port: 8001
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: request-service
  namespace: ems
  labels:
    app: request-service
spec:
  selector:
    app: request-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: request-service-nodeport
  namespace: ems
  labels:
    app: request-service
spec:
  type: NodePort
  selector:
    app: request-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
      nodePort: 30081
---
